name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up verification dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
      - run: make requirements
      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements/output/
          if-no-files-found: error
      - name: Validate component version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python build_tools/release/component.py check-pr-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - run: make phone test-android test-adhoc
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            zmala_phone/app/build/outputs/apk/debug/app-debug.apk
            zmala_phone/app/build/reports/tests/
          if-no-files-found: error
