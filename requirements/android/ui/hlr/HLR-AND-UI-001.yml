text: The app shall use the shared Zmala A1 mark for in-app branding and portrait fallback, the A3 dark
  mark for the launcher, and the terminal palette with large contact and call controls,
  compact portrait-and-name contact rows, QR setup and a visible indication of incoming-alert availability.
  Contact names shall show green Available for recently confirmed activity, blue Try calling for
  unconfirmed push eligibility and red Offline when neither is known. Green and blue names shall
  permit an attempted call from the contact page while registered; red contacts shall open their
  page for callback actions with Call disabled. Each contact row shall be a single tappable card
  opening that person's actions rather than initiating a call. The labels shall
  explain the state without relying on colour alone.
  The contact screen shall omit the phone account name and routine ready status.
  User-facing wording shall support English/French according to Android's locale selection and
  remain usable with enlarged text and accessibility services.
  Calls shall use a video-first view with a bottom-right local preview, temporary icon controls,
  portrait/landscape adaptation and animated outgoing ringing feedback. After answer, the app shall
  indicate video startup progress, then explain delayed video calmly if no frame arrives within
  fifteen seconds, without ending an otherwise usable call.
verification: Inspect the launcher for the A3 dark mark and the in-app logo/portrait fallback for the shared A1 mark.
  Inspect enrollment, contacts and incoming/active call screens on Android and compare with
  the terminal palette and shared logo. Supply recently active, push-only and offline contacts;
  check the green/blue/red cards and labels, open offline actions with Call disabled, then initiate
  calls from both the available and push-only contact pages.
