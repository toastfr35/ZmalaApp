text: |
  The app shall accept a family-call-server QR of at most 8,192 Java characters with integer version 1, the App
  account discriminator and valid device ID/token. The server URL shall be an
  HTTP(S) origin without user information, query or fragment, with an omitted
  port or a port in 1–65535. Received configuration shall use integer schema
  version 1 and match the enrolled device ID, App type and call authentication key.
  String, Boolean and fractional versions shall be rejected without coercion.

  Camera and file setup shall display the validated server origin for explicit confirmation
  before fetching configuration. HTTP setup shall warn that LAN setup and calls are unencrypted.
  Enrollment shall be saved only after a matching configuration has been validated.
  Camera scanning and the visible configuration refresh shall require camera and
  microphone permission, plus local-network permission on Android API 37 or later.

  Configuration shall contain at most 40 contact objects with unique valid account
  IDs, nonblank string names of at most 80 characters, SIP URIs matching each ID
  and the configured domain, and Boolean can_call/can_receive permissions.
  A missing or empty-string portrait shall mean no portrait. Other portraits shall
  be string /photos/<hash>.<extension> paths with a nonempty lowercase hexadecimal
  hash and png, jpg or gif extension. Malformed entries shall be rejected before
  rendering or notice reconciliation. Malformed secure-call configurations and
  secure mode over HTTP enrollment shall be rejected.

  Standard authenticated configuration, portrait, callback and push HTTP requests shall use
  six-second connect and read timeouts and reject redirects. Configuration responses shall be
  bounded to 256 KiB, callback responses to 16 KiB and push/decline responses to 8 KiB.
  Live-call photo transport uses the separate limits in LLR-AND-CALL-007.
  Account portraits shall be downloaded only from same-origin paths,
  with PNG/JPEG bounded to 2 MiB and GIF to 16 MiB.

  Enrollment credentials shall be stored in application-private no-backup storage;
  fetched SIP and TURN credentials shall remain in memory. Private missed-call and callback
  history, cached caller names, notification state and general app/update preferences may
  persist for their respective features. Secure calling may materialize Android-derived
  trust roots in private no-backup storage. Android backup shall remain disabled.
  Android Clear storage / Clear app data shall remove enrollment and terminate
  the process; reopening shall return to QR setup.

  The Android launcher shall offer a Forget setup shortcut. It shall require
  confirmation before deleting the saved enrollment, stopping the call session,
  discarding old account state and returning to QR setup. Cancelling shall preserve
  enrollment. Forgetting setup shall preserve general app preferences.

  Setup shall support a local QR image or setup PDF through Android's document picker
  without broad storage permission, retaining a copy or uploading the document.
  Input shall be bounded to 20 MiB. Images shall be bounded to 64 million source
  pixels. PDFs shall search the first ten pages for a valid App QR and skip unrelated
  codes. Images and PDF pages shall be decoded at no more than 1800 pixels per side.
  Imported text shall use the camera QR validation and explicit server confirmation.
  Cancellation shall preserve setup.
verification: |
  Test malformed/mismatched QR and configuration, strict version types and port
  boundaries. Reject malformed contacts, duplicate IDs, oversized/blank names,
  mismatched SIP addresses, non-Boolean permissions and non-string/unsafe photos.
  Accept valid boundary names, permissions and portrait formats. Exercise response
  limits and redirects without forwarding credentials. Test persistence and Android
  app-data clearing and inspect manifest and no-backup policy. Verify that confirmation
  cancellation or rejected configuration does not save enrollment, HTTP confirmation warns
  about unencrypted calls, and permission checks include local-network access from API 37.
  Launch Forget setup, cancel once, then confirm and verify enrollment is removed while app preferences
  persist. Decode QR images and a multi-page PDF containing download and App QR
  codes. Reject invalid and oversized input and check stream closure, scratch
  cleanup and cancellation.
